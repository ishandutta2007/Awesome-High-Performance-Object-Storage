<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 44px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
    
    /* Subtle Dynamic Animations in background elements */
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }
    @keyframes floatPath {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -100; }
    }
    .pulsing-orb { animation: pulse 6s ease-in-out infinite; transform-origin: center; }
    .animated-line { stroke-dasharray: 10, 10; animation: floatPath 4s linear infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="320" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="320" fill="url(#grid)" rx="16" />

  <!-- Animated Dynamic Background Elements (Kept faint and positioned away from centered text) -->
  <circle cx="150" cy="80" r="120" fill="#38bdf8" class="pulsing-orb" opacity="0.25" filter="url(#glow)" />
  <circle cx="1050" cy="240" r="140" fill="#818cf8" class="pulsing-orb" opacity="0.25" filter="url(#glow)" />

  <!-- Dynamic Data Flow Lines (Background Decoration) -->
  <path d="M 50 260 Q 250 200 450 280 T 850 220 T 1150 270" fill="none" stroke="url(#accentGrad)" stroke-width="2" class="animated-line" opacity="0.4" />
  <path d="M 50 60 Q 350 120 650 40 T 1150 70" fill="none" stroke="#38bdf8" stroke-width="1.5" class="animated-line" opacity="0.3" />

  <!-- Storage Node Visual Metrics (Corners) -->
  <g transform="translate(60, 200)" opacity="0.6">
    <rect width="140" height="50" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="15" y="30" class="badge-text">⚡ 10x Latency</text>
  </g>
  <g transform="translate(1000, 70)" opacity="0.6">
    <rect width="140" height="50" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="15" y="30" class="badge-text">📦 Exabyte Scale</text>
  </g>

  <!-- FOREGROUND CONTENT (Primary Title & Subtitle - Crisp and Unobstructed) -->
  <!-- Top Pill -->
  <g transform="translate(470, 45)">
    <rect width="260" height="32" rx="16" fill="#1e293b" stroke="url(#accentGrad)" stroke-width="1.5" />
    <text x="130" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#38bdf8">⚡ CURATED ENTERPRISE ECOSYSTEM ⚡</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="135" text-anchor="middle" class="title">High-Performance Object Storage</text>

  <!-- Accent Divider Line -->
  <rect x="450" y="155" width="300" height="4" rx="2" fill="url(#accentGrad)" filter="url(#glow)" />

  <!-- Subtitle -->
  <text x="600" y="200" text-anchor="middle" class="subtitle">Commercial SaaS Platforms &amp; Open-Source S3-Compatible Storage Systems</text>

  <!-- Bottom Metadata Pills -->
  <g transform="translate(600, 255)">
    <text x="-220" y="0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#94a3b8">🚀 Single-Digit ms Latency</text>
    <text x="0" y="0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#94a3b8">🔒 Erasure Coding &amp; Security</text>
    <text x="220" y="0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#94a3b8">🤖 AI/ML Data Lakehouse</text>
  </g>
</svg>
