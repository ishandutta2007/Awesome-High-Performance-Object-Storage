<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse{0%{opacity:.3;transform:scale(1)}50%{opacity:.7;transform:scale(1.08)}}@keyframes floatPath{0%{stroke-dashoffset:0}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,sans-serif}.title{font-weight:800;font-size:44px;fill:#fff}.subtitle{font-weight:500;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:14px;fill:#38bdf8}.pulsing-orb{animation:pulse 6s ease-in-out infinite;transform-origin:center}.animated-line{stroke-dasharray:10,10;animation:floatPath 4s linear infinite}</style><rect width="1200" height="320" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="320" fill="url(#grid)" rx="16"/><circle cx="150" cy="80" r="120" fill="#38bdf8" class="pulsing-orb" filter="url(#glow)" opacity=".25"/><circle cx="1050" cy="240" r="140" fill="#818cf8" class="pulsing-orb" filter="url(#glow)" opacity=".25"/><path fill="none" stroke="url(#accentGrad)" stroke-width="2" d="M 50 260 Q 250 200 450 280 T 850 220 T 1150 270" class="animated-line" opacity=".4"/><path fill="none" stroke="#38bdf8" stroke-width="1.5" d="M 50 60 Q 350 120 650 40 T 1150 70" class="animated-line" opacity=".3"/><g opacity=".6" transform="translate(60, 200)"><rect width="140" height="50" fill="#1e293b" stroke="#334155" rx="8"/><text x="15" y="30" class="badge-text">⚡ 10x Latency</text></g><g opacity=".6" transform="translate(1000, 70)"><rect width="140" height="50" fill="#1e293b" stroke="#334155" rx="8"/><text x="15" y="30" class="badge-text">📦 Exabyte Scale</text></g><g transform="translate(470, 45)"><rect width="260" height="32" fill="#1e293b" stroke="url(#accentGrad)" stroke-width="1.5" rx="16"/><text x="130" y="21" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ CURATED ENTERPRISE ECOSYSTEM ⚡</text></g><text x="600" y="135" class="title" text-anchor="middle">High-Performance Object Storage</text><rect width="300" height="4" x="450" y="155" fill="url(#accentGrad)" filter="url(#glow)" rx="2"/><text x="600" y="200" class="subtitle" text-anchor="middle">Commercial SaaS Platforms &amp; Open-Source S3-Compatible Storage Systems</text><g><text x="-220" y="0" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" transform="translate(600, 255)">🚀 Single-Digit ms Latency</text><text x="0" y="0" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" transform="translate(600, 255)">🔒 Erasure Coding &amp; Security</text><text x="220" y="0" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" transform="translate(600, 255)">🤖 AI/ML Data Lakehouse</text></g></svg>